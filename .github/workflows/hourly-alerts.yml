name: Hourly Alerts

# Checks for breaking news matching each subscriber's tracked competitors and
# keywords, and sends a real-time alert email. Dedup + recency filtering live
# in the /api/alerts/run handler, so running often is safe.

on:
  # Automatic hourly runs are PAUSED during setup/testing so broad test
  # keywords can't flood the inbox. Re-enable by uncommenting the schedule
  # below once real (narrow) keywords are set and you're ready to launch.
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert check
        run: |
          echo "Checking for real-time alerts..."
          curl -fsS --max-time 600 \
            "https://briefly-ai-wewv.onrender.com/api/alerts/run?token=${{ secrets.BRIEFING_RUN_TOKEN }}"
          echo ""
          echo "Done."
